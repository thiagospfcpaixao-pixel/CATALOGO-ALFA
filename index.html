<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo & Pedidos — WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-28 antialiased">
  <!-- Cabeçalho fixo com busca e botão de pedido -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">Catálogo de Produtos</h1>
        <p class="text-xs sm:text-sm text-slate-500">Monte seu pedido e envie direto para o WhatsApp</p>
      </div>

      <div class="flex items-center gap-2.5 w-full sm:w-auto sm:flex-1 sm:max-w-md justify-end">
        <div class="relative flex-1">
          <input
            id="searchInput"
            type="search"
            placeholder="Buscar por nome ou código..."
            autocomplete="off"
            class="w-full rounded-full bg-slate-100 border border-slate-200 px-4 py-2 text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:border-teal-600 focus:outline-none transition"
          />
        </div>

        <button
          id="openDrawerTopBtn"
          type="button"
          class="shrink-0 inline-flex items-center gap-2 rounded-full bg-teal-700 hover:bg-teal-800 active:scale-[0.99] text-white font-semibold text-sm px-4 py-2.5 transition cursor-pointer"
        >
          <span>Pedido</span>
          <span id="topBadge" class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 rounded-full bg-white text-teal-800 text-xs font-extrabold">
            0
          </span>
        </button>
      </div>
    </div>

    <!-- Barra de categorias -->
    <nav id="categoryBar" aria-label="Categorias" class="max-w-7xl mx-auto px-4 sm:px-6 pb-3 flex items-center gap-2 overflow-x-auto no-scrollbar"></nav>
  </header>

  <!-- Conteúdo principal -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-4">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 text-xs sm:text-sm text-slate-500">
      <span id="resultCount">Carregando produtos...</span>
      <span>WhatsApp: (79) 99662-7734</span>
    </div>

    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </main>

  <!-- Barra inferior flutuante -->
  <div class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 shadow-[0_-4px_20px_rgba(15,23,42,0.08)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
      <div>
        <div id="floatTotal" class="text-base sm:text-lg font-extrabold text-slate-900">Total estimado: R$ 0,00</div>
        <div id="floatCount" class="text-xs text-slate-500">0 itens no pedido</div>
      </div>

      <div class="flex items-center gap-2.5">
        <button
          id="openDrawerFloatBtn"
          type="button"
          class="flex-1 sm:flex-none rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm px-4 py-2.5 border border-slate-200 transition cursor-pointer"
        >
          Ver resumo
        </button>
        <button
          id="floatSendBtn"
          type="button"
          disabled
          class="flex-1 sm:flex-none rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-45 disabled:cursor-not-allowed text-white font-semibold text-sm px-5 py-2.5 transition cursor-pointer"
        >
          Enviar WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Gaveta lateral de resumo do pedido -->
  <div id="drawerBackdrop" class="fixed inset-0 z-50 bg-slate-950/50 hidden justify-end" aria-hidden="true">
    <aside class="w-full max-w-md bg-white h-full flex flex-col shadow-2xl" role="dialog" aria-label="Resumo do pedido">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-slate-900">Resumo do Pedido</h2>
          <p class="text-xs text-slate-500">Confira quantidades e valores antes de enviar</p>
        </div>
        <button
          id="closeDrawerBtn"
          type="button"
          aria-label="Fechar resumo"
          class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800 text-xl font-bold cursor-pointer"
        >
          &times;
        </button>
      </div>

      <div id="drawerItems" class="flex-1 overflow-y-auto px-5 py-4 space-y-3"></div>

      <div class="p-5 bg-slate-50 border-t border-slate-200 space-y-3">
        <div>
          <label for="clientName" class="block text-xs font-semibold text-slate-700 mb-1">Nome ou empresa (opcional)</label>
          <input
            id="clientName"
            type="text"
            placeholder="Ex.: Mercadinho Central"
            class="w-full rounded-xl bg-white border border-slate-300 px-3.5 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-teal-600 focus:outline-none"
          />
        </div>

        <div>
          <label for="clientNotes" class="block text-xs font-semibold text-slate-700 mb-1">Observações (opcional)</label>
          <input
            id="clientNotes"
            type="text"
            placeholder="Ex.: Preferência de entrega no período da manhã"
            class="w-full rounded-xl bg-white border border-slate-300 px-3.5 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-teal-600 focus:outline-none"
          />
        </div>

        <div class="pt-1 flex items-center justify-between text-base font-extrabold text-slate-900">
          <span>Total geral</span>
          <span id="drawerTotal" class="text-teal-700">R$ 0,00</span>
        </div>

        <button
          id="drawerSendBtn"
          type="button"
          disabled
          class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-45 disabled:cursor-not-allowed text-white font-bold text-sm py-3 transition cursor-pointer"
        >
          Enviar pedido para o WhatsApp
        </button>
      </div>
    </aside>
  </div>

      { code: '2569', name: 'Tilapia eviscerada cx 15kg brasil pesc', category: 'Peixes e Frutos do Mar', step: 15, unitPrice: 20.39 },
      { code: '699', name: 'Toucinho suino salgado cx10 kg frimon', category: 'Carnes Suínas, Defumados e Embutidos', step: 10, unitPrice: 24.47 },
      { code: '2255', name: 'Tripa fina bov cong dourado', category: 'Carnes Bovinas e Miúdos', step: 15, unitPrice: 15.29 }
    ];

    // Normaliza descrições para sentence case
    const PRODUCTS = RAW_PRODUCTS.map((item) => ({
      ...item,
      name: toSentenceCase(item.name)
    }));

    // Estado da aplicação: code -> quantidade total acumulada (múltiplo de step)
    const orderQuantities = new Map();
    let activeCategory = 'Todas';
    let searchTerm = '';

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatQuantity(val) {
      const rounded = Math.round(Number(val) * 100) / 100;
      return rounded.toLocaleString('pt-BR', {
        minimumFractionDigits: Number.isInteger(rounded) ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function getProductByCode(code) {
      return PRODUCTS.find((p) => p.code === code);
    }

    function getItemSubtotal(product, qty) {
      const cleanQty = Math.round(Number(qty) * 100) / 100;
      return Math.round(cleanQty * product.unitPrice * 100) / 100;
    }

    function incrementProduct(code) {
      const product = getProductByCode(code);
      if (!product) return;
      const current = orderQuantities.get(code) || 0;
      const nextQty = Math.round((current + product.step) * 100) / 100;
      orderQuantities.set(code, nextQty);
      render();
    }

    function decrementProduct(code) {
      const product = getProductByCode(code);
      if (!product) return;
      const current = orderQuantities.get(code) || 0;
      const nextQty = Math.round((current - product.step) * 100) / 100;
      if (nextQty <= 0.0001) {
        orderQuantities.delete(code);
      } else {
        orderQuantities.set(code, nextQty);
      }
      render();
    }

    function removeProduct(code) {
      orderQuantities.delete(code);
      render();
    }

    function renderCategories() {
      const categories = ['Todas', ...new Set(PRODUCTS.map((p) => p.category))];
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = categories
        .map((cat) => {
          const emoji = CATEGORY_EMOJIS[cat] || '📦';
          const isSelected = cat === activeCategory;
          const classes = isSelected
            ? 'bg-teal-700 text-white border-teal-700'
            : 'bg-white text-slate-700 border-slate-200 hover:border-teal-600';
          return `
            <button
              type="button"
              data-category="${cat.replace(/"/g, '&quot;')}"
              class="shrink-0 rounded-full border px-3.5 py-1.5 text-xs sm:text-sm font-medium transition cursor-pointer ${classes}"
            >
              ${emoji} ${cat}
            </button>
          `;
        })
        .join('');

      bar.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          renderCategories();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      const query = searchTerm.trim().toLowerCase();
      const filtered = PRODUCTS.filter((p) => {
        const matchesCat = activeCategory === 'Todas' || p.category === activeCategory;
        const matchesQuery =
          !query ||
          p.name.toLowerCase().includes(query) ||
          p.code.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      const countEl = document.getElementById('resultCount');
      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'produto exibido' : 'produtos exibidos'} (total de ${PRODUCTS.length})`;

      const grid = document.getElementById('productGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500 text-sm">
            Nenhum produto encontrado para o filtro selecionado.
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered
        .map((p) => {
          const qty = orderQuantities.get(p.code) || 0;
          const hasQty = qty > 0;
          const subtotal = getItemSubtotal(p, qty);
          const emoji = CATEGORY_EMOJIS[p.category] || '📦';

          const controlsHtml = hasQty
            ? `
              <div class="flex items-center justify-between gap-2 w-full">
                <button
                  type="button"
                  onclick="decrementProduct('${p.code}')"
                  aria-label="Diminuir quantidade"
                  class="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-base flex items-center justify-center transition cursor-pointer"
                >
                  &minus;
                </button>
                <span class="font-bold text-sm text-slate-900">${formatQuantity(qty)}</span>
                <button
                  type="button"
                  onclick="incrementProduct('${p.code}')"
                  aria-label="Adicionar mais"
                  class="w-9 h-9 rounded-lg bg-teal-700 hover:bg-teal-800 text-white font-bold text-base flex items-center justify-center transition cursor-pointer"
                >
                  +
                </button>
              </div>
            `
            : `
              <button
                type="button"
                onclick="incrementProduct('${p.code}')"
                class="w-full rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-semibold text-sm py-2.5 px-3 transition cursor-pointer"
              >
                Adicionar
              </button>
            `;

          return `
            <article class="bg-white rounded-2xl border ${hasQty ? 'border-teal-600 ring-1 ring-teal-600/20' : 'border-slate-200'} p-4 shadow-sm flex flex-col justify-between gap-3 transition">
              <div>
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-bold text-slate-500">Cód. ${p.code}</span>
                  <span class="inline-flex items-center gap-1 rounded-full bg-teal-50 text-teal-800 px-2.5 py-0.5 text-[11px] font-semibold truncate max-w-[175px]">
                    <span>${emoji}</span>
                    <span class="truncate">${p.category}</span>
                  </span>
                </div>

                <h3 class="text-sm sm:text-[15px] font-semibold text-slate-900 leading-snug">${p.name}</h3>

                <div class="mt-3 flex items-baseline justify-between gap-2">
                  <span class="text-base sm:text-lg font-extrabold text-teal-700">${formatCurrency(p.unitPrice)}</span>
                  <span class="text-[11px] font-medium text-slate-400">valor unitário</span>
                </div>
              </div>

              <div class="pt-2.5 border-t border-slate-100 space-y-2">
                <div class="min-h-[18px] text-xs text-slate-600 flex items-center justify-between">
                  ${hasQty ? `<span>Subtotal:</span><strong class="text-slate-900">${formatCurrency(subtotal)}</strong>` : '<span>&nbsp;</span>'}
                </div>
                ${controlsHtml}
              </div>
            </article>
          `;
        })
        .join('');
    }

    function renderDrawerAndTotals() {
      const selectedEntries = [];
      let grandTotal = 0;

      for (const [code, qty] of orderQuantities.entries()) {
        const product = getProductByCode(code);
        if (!product || qty <= 0) continue;
        const subtotal = getItemSubtotal(product, qty);
        grandTotal = Math.round((grandTotal + subtotal) * 100) / 100;
        selectedEntries.push({ product, qty, subtotal });
      }

      const itemCount = selectedEntries.length;
      document.getElementById('topBadge').textContent = String(itemCount);
      document.getElementById('floatTotal').textContent = `Total estimado: ${formatCurrency(grandTotal)}`;
      document.getElementById('floatCount').textContent = `${itemCount} ${itemCount === 1 ? 'item no pedido' : 'itens no pedido'}`;
      document.getElementById('drawerTotal').textContent = formatCurrency(grandTotal);

      const isDisabled = itemCount === 0;
      document.getElementById('floatSendBtn').disabled = isDisabled;
      document.getElementById('drawerSendBtn').disabled = isDisabled;

      const drawerItems = document.getElementById('drawerItems');
      if (itemCount === 0) {
        drawerItems.innerHTML = `
          <div class="py-12 px-4 text-center text-sm text-slate-500">
            Nenhum item adicionado ainda.<br />
            Toque em <strong>Adicionar</strong> nos produtos do catálogo.
          </div>
        `;
        return;
      }

      drawerItems.innerHTML = selectedEntries
        .map(
          ({ product, qty, subtotal }) => `
            <div class="rounded-xl border border-slate-200 bg-white p-3.5 space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-sm font-semibold text-slate-900 leading-snug">${product.name}</div>
                  <div class="text-xs text-slate-500 mt-0.5">Cód. ${product.code} &bull; Unit.: ${formatCurrency(product.unitPrice)}</div>
                </div>
                <button
                  type="button"
                  onclick="removeProduct('${product.code}')"
                  class="text-xs font-semibold text-rose-600 hover:text-rose-700 shrink-0 cursor-pointer"
                >
                  Remover
                </button>
              </div>

              <div class="flex items-center justify-between gap-3 pt-1">
                <div class="inline-flex items-center gap-2">
                  <button
                    type="button"
                    onclick="decrementProduct('${product.code}')"
                    class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold flex items-center justify-center cursor-pointer"
                  >
                    &minus;
                  </button>
                  <span class="min-w-[44px] text-center text-sm font-bold text-slate-900">${formatQuantity(qty)}</span>
                  <button
                    type="button"
                    onclick="incrementProduct('${product.code}')"
                    class="w-8 h-8 rounded-lg bg-teal-700 hover:bg-teal-800 text-white font-bold flex items-center justify-center cursor-pointer"
                  >
                    +
                  </button>
                </div>

                <span class="text-sm font-extrabold text-slate-900">${formatCurrency(subtotal)}</span>
              </div>
            </div>
          `
        )
        .join('');
    }

    function sendOrderToWhatsApp() {
      const selectedEntries = [];
      let grandTotal = 0;

      for (const [code, qty] of orderQuantities.entries()) {
        const product = getProductByCode(code);
        if (!product || qty <= 0) continue;
        const subtotal = getItemSubtotal(product, qty);
        grandTotal = Math.round((grandTotal + subtotal) * 100) / 100;
        selectedEntries.push({ product, qty, subtotal });
      }

      if (selectedEntries.length === 0) return;

      const clientName = document.getElementById('clientName').value.trim();
      const clientNotes = document.getElementById('clientNotes').value.trim();

      const lines = ['*NOVO PEDIDO*', ''];
      if (clientName) {
        lines.push(`*Cliente/Empresa:* ${clientName}`);
      }

      selectedEntries.forEach(({ product, qty, subtotal }) => {
        lines.push(
          `• *${product.code}* - ${product.name} | Qtde: *${formatQuantity(qty)}* | Unit: ${formatCurrency(product.unitPrice)} | Subtotal: *${formatCurrency(subtotal)}*`
        );
      });

      lines.push('');
      lines.push(`*TOTAL GERAL: ${formatCurrency(grandTotal)}*`);

      if (clientNotes) {
        lines.push(`*Observações:* ${clientNotes}`);
      }

      const encodedText = encodeURIComponent(lines.join('\n'));
      const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedText}`;
      window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
    }

    function openDrawer() {
      const backdrop = document.getElementById('drawerBackdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeDrawer() {
      const backdrop = document.getElementById('drawerBackdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      backdrop.setAttribute('aria-hidden', 'true');
    }

    function render() {
      renderProducts();
      renderDrawerAndTotals();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderProducts();
    });

    document.getElementById('openDrawerTopBtn').addEventListener('click', openDrawer);
    document.getElementById('openDrawerFloatBtn').addEventListener('click', openDrawer);
    document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
    document.getElementById('drawerBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'drawerBackdrop') {
        closeDrawer();
      }
    });

    document.getElementById('floatSendBtn').addEventListener('click', sendOrderToWhatsApp);
    document.getElementById('drawerSendBtn').addEventListener('click', sendOrderToWhatsApp);

    renderCategories();
    render();
  </script>
